<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;display:grid;place-items:center;
    background:radial-gradient(120% 90% at 50% 0%,#1c2333 0%,#0a0c11 65%);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:#e6edf3;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{display:flex;flex-direction:column;gap:12px;align-items:center;padding:20px}
  .hud{
    width:min(92vw,440px);display:flex;justify-content:space-between;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7f8b9e;
  }
  .hud b{color:#4ade80;font-size:14px}
  .board{position:relative;line-height:0}
  canvas{
    display:block;width:min(92vw,440px);height:auto;border-radius:14px;
    background:#1a1e2a;box-shadow:0 0 0 1px #2b3242,0 24px 60px -24px #000;
    touch-action:none;
  }
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;text-align:center;
    padding:22px;border-radius:14px;background:rgba(10,12,17,.82);
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);cursor:pointer;
  }
  .overlay[hidden]{display:none}
  .overlay h1{margin:0;font-size:20px;letter-spacing:.18em;color:#fff}
  .overlay p{margin:0;font-size:12.5px;line-height:1.8;color:#94a1b5}
  .overlay b{color:#4ade80}
  button{
    margin-top:8px;padding:10px 24px;border:0;border-radius:999px;cursor:pointer;
    font:inherit;font-size:13px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:#07230f;
    background:linear-gradient(#86efac,#4ade80);
    box-shadow:0 6px 18px -6px #4ade80;
  }
  button:active{transform:translateY(1px)}
  .hint{font-size:11px;letter-spacing:.1em;color:#5f6b7d;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span>Score <b id="score">0</b></span>
    <span>Best <b id="best">0</b></span>
  </div>

  <div class="board">
    <canvas id="game" width="440" height="440"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="ovTitle">SNAKE</h1>
      <p id="ovText"></p>
      <button id="ovBtn">Start</button>
    </div>
  </div>

  <div class="hint">← ↑ → ↓ / WASD &nbsp;·&nbsp; space = restart</div>
</div>

<script>
(() => {
  'use strict';

  const canvas  = document.getElementById('game');
  const ctx     = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText  = document.getElementById('ovText');
  const ovBtn   = document.getElementById('ovBtn');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');

  const COLS = 20, ROWS = 20, CELL = canvas.width / COLS; // 22px
  const BASE_STEP = 135, MIN_STEP = 65;                   // ms per move
  const BEST_KEY = 'snake.best.v1';

  let snake, dir, queue, food, score, stepMs, state, acc, last;
  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}

  /* ---------- helpers ---------- */
  const rnd = n => Math.floor(Math.random() * n);

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y,     x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x,     y + h, r);
    ctx.arcTo(x,     y + h, x,     y,     r);
    ctx.arcTo(x,     y,     x + w, y,     r);
    ctx.closePath();
  }

  function syncHud() {
    scoreEl.textContent = score;
    bestEl.textContent  = best;
  }

  /* ---------- game setup ---------- */
  function spawnFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    return free.length ? free[rnd(free.length)] : { x: 0, y: 0 };
  }

  function reset() {
    snake  = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir    = { x: 1, y: 0 };
    queue  = [];
    score  = 0;
    stepMs = BASE_STEP;
    state  = 'ready';
    food   = spawnFood();
    acc    = 0;
    last   = performance.now();
    syncHud();
  }

  function start() {
    reset();
    state = 'playing';
    overlay.hidden = true;
    last = performance.now();
    ovBtn.blur();
  }

  function gameOver() {
    state = 'over';
    if (score > best) {
      best = score;
      try { localStorage.setItem(BEST_KEY, best); } catch (e) {}
    }
    syncHud();
    showOverlay('GAME OVER',
      `Score <b>${score}</b> &nbsp;·&nbsp; Best <b>${best}</b><br>Press space to try again`,
      'Play again');
  }

  function showOverlay(title, html, btn) {
    ovTitle.textContent = title;
    ovText.innerHTML    = html;
    ovBtn.textContent   = btn;
    overlay.hidden      = false;
  }

  /* ---------- input ---------- */
  function turn(x, y) {
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if ((x === -ref.x && y === -ref.y) || (x === ref.x && y === ref.y)) return;
    if (queue.length < 2) queue.push({ x, y });
  }

  const KEYS = {
    arrowup:[0,-1], w:[0,-1],
    arrowdown:[0,1], s:[0,1],
    arrowleft:[-1,0], a:[-1,0],
    arrowright:[1,0], d:[1,0]
  };

  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (KEYS[k]) {
      e.preventDefault();
      if (state === 'ready') start();
      if (state === 'playing') turn(KEYS[k][0], KEYS[k][1]);
    } else if (k === ' ' || k === 'enter') {
      e.preventDefault();
      if (state !== 'playing') start();
    }
  });

  overlay.addEventListener('click', start);

  // swipe support
  let tStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    tStart = { x: t.clientX, y: t.clientY };
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    if (!tStart) return;
    const t  = e.changedTouches[0];
    const dx = t.clientX - tStart.x;
    const dy = t.clientY - tStart.y;
    tStart = null;
    e.preventDefault();
    if (Math.hypot(dx, dy) < 20) return;               // tap, ignore
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
    else                             turn(0, Math.sign(dy));
  }, { passive: false });

  /* ---------- logic ---------- */
  function step() {
    if (queue.length) dir = queue.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // walls
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS)
      return gameOver();

    const grow = head.x === food.x && head.y === food.y;
    const body = grow ? snake : snake.slice(0, -1);   // tail moves away

    if (body.some(s => s.x === head.x && s.y === head.y))
      return gameOver();

    snake.unshift(head);

    if (grow) {
      score++;
      stepMs = Math.max(MIN_STEP, BASE_STEP - score * 3);
      food   = spawnFood();
      syncHud();
    } else {
      snake.pop();
    }
  }

  /* ---------- rendering ---------- */
  function draw() {
    const W = canvas.width, H = canvas.height;

    ctx.fillStyle = '#1a1e2a';
    ctx.fillRect(0, 0, W, H);

    // grid
    ctx.strokeStyle = 'rgba(255,255,255,.035)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) { ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, H); }
    for (let j = 1; j < ROWS; j++) { ctx.moveTo(0, j * CELL + .5); ctx.lineTo(W, j * CELL + .5); }
    ctx.stroke();

    // food
    const pulse = 1 + Math.sin(performance.now() / 160) * 0.09;
    ctx.save();
    ctx.shadowColor = 'rgba(248,113,113,.9)';
    ctx.shadowBlur  = 18;
    ctx.fillStyle   = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2,
            (CELL / 2 - 4) * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // snake (tail → head)
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const k = snake.length > 1 ? i / (snake.length - 1) : 0;
      const head = i === 0;

      if (head) {
        ctx.save();
        ctx.shadowColor = 'rgba(74,222,128,.55)';
        ctx.shadowBlur  = 14;
        ctx.fillStyle   = '#7cf7b0';
      } else {
        ctx.fillStyle = `hsl(147 55% ${46 - 16 * k}%)`;
      }

      rrect(s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3, 6);
      ctx.fill();
      if (head) ctx.restore();
    }

    // eyes
    const hx = snake[0].x * CELL + CELL / 2;
    const hy = snake[0].y * CELL + CELL / 2;
    const ox = dir.x * CELL * 0.16, oy = dir.y * CELL * 0.16;
    const px = -dir.y * CELL * 0.18, py = dir.x * CELL * 0.18;
    ctx.fillStyle = '#0b1a12';
    for (const s of [1, -1]) {
      ctx.beginPath();
      ctx.arc(hx + ox + px * s, hy + oy + py * s, CELL * 0.09, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---------- main loop ---------- */
  function loop(now) {
    const dt = Math.min(now - last, 250);
    last = now;

    if (state === 'playing') {
      acc += dt;
      while (acc >= stepMs && state === 'playing') {
        acc -= stepMs;
        step();
      }
      if (state !== 'playing') acc = 0;
    }

    draw();
    requestAnimationFrame(loop);
  }

  /* ---------- boot ---------- */
  reset();
  showOverlay('SNAKE',
    'Eat the red dots — avoid the walls and yourself.<br>Arrow keys / WASD to move',
    'Start');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
